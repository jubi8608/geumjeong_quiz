<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>금정수학 개념퀴즈</title>
<meta name="description" content="금정수학 학생용 수학 개념 퀴즈 — 초3~중3 전 단원">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Urbanist:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --P:#FF6B9D; --PL:#FFB3CC; --PD:#D04F80;
  --A:#FFD93D; --S:#4ECDC4;
  --BG:#FFF9F0; --CARD:#fff; --TEXT:#2D3436; --MUTED:#636E72; --BORDER:#E8ECF4;
  --R:18px; --RS:10px;
  --SH:0 6px 28px rgba(255,107,157,.14);
  --SHH:0 12px 40px rgba(255,107,157,.22);
  --BR:50px;
}
body.mid{
  --P:#1A2E5A; --PL:#4A90D9; --PD:#0F1E3D;
  --A:#F39C12; --S:#27AE60;
  --BG:#F2F5FB; --TEXT:#1A2E5A; --MUTED:#5A6A8A; --BORDER:#D8E2F0;
  --R:10px; --RS:6px;
  --SH:0 4px 20px rgba(26,46,90,.10);
  --SHH:0 8px 32px rgba(26,46,90,.18);
  --BR:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--BG);color:var(--TEXT);min-height:100vh;transition:background .4s,color .3s}
.page{display:none}.page.on{display:block}
.wrap{max-width:700px;margin:0 auto;padding:14px 14px 80px}

/* LOGO */
.logo{text-align:center;padding:22px 0 14px}
.logo-mark-wrap{display:flex;align-items:center;justify-content:center;gap:10px}
.logo-mark{flex:none;display:block}
.logo-txt{font-size:24px;font-weight:800;color:var(--P)}
.logo-txt span{color:#2563EB}
.quiz-brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;padding:10px 12px;background:color-mix(in srgb,var(--CARD) 88%,var(--P));border:1.5px solid color-mix(in srgb,var(--P) 18%,var(--BORDER));border-radius:var(--RS);box-shadow:var(--SH)}
.quiz-brand-left{display:flex;align-items:center;gap:9px;min-width:0}
.quiz-brand-left .logo-mark{flex:none}
.quiz-brand-name{font-size:15px;font-weight:900;color:var(--P);white-space:nowrap;letter-spacing:0}
.quiz-brand-name span{color:#2563EB}
.quiz-brand-badge{font-size:11px;font-weight:800;color:var(--MUTED);white-space:nowrap}

/* CARD */
.card{background:var(--CARD);border-radius:var(--R);box-shadow:var(--SH);padding:24px 22px;margin-bottom:16px;transition:box-shadow .3s}

/* FORM */
.pg-h{font-size:22px;font-weight:800;color:var(--P);margin-bottom:3px}
.pg-s{font-size:13px;color:var(--MUTED);margin-bottom:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--P);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fg input{width:100%;padding:11px 13px;border:2px solid var(--BORDER);border-radius:var(--RS);font-size:15px;font-family:inherit;color:var(--TEXT);background:#FAFBFF;outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
.fg input:focus{border-color:var(--P);box-shadow:0 0 0 3px color-mix(in srgb,var(--P) 14%,transparent)}
.lbl{font-size:11px;font-weight:800;color:var(--P);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.grade-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.gb{padding:9px 2px;border:2px solid var(--BORDER);border-radius:var(--RS);text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--MUTED);background:#FAFBFF;transition:all .2s;user-select:none}
.gb:hover{border-color:var(--P);color:var(--P)}
.gb.on{border-color:var(--P);background:var(--P);color:#fff;transform:scale(1.05)}
.sem-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sb{padding:10px;border:2px solid var(--BORDER);border-radius:var(--RS);text-align:center;cursor:pointer;font-size:14px;font-weight:700;color:var(--MUTED);background:#FAFBFF;transition:all .2s}
.sb.on{border-color:var(--P);background:var(--P);color:#fff}
.chap-l{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.cb{padding:11px 14px;border:2px solid var(--BORDER);border-radius:var(--RS);cursor:pointer;font-size:13px;font-weight:600;color:var(--TEXT);background:#FAFBFF;transition:all .2s;text-align:left}
.cb:hover{border-color:var(--P);color:var(--P)}
.cb.on{border-color:var(--P);background:linear-gradient(135deg,var(--P),var(--PL));color:#fff}

/* BUTTONS */
.btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--P),var(--PL));color:#fff;border:none;border-radius:var(--BR);font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .25s;box-shadow:0 4px 14px rgba(0,0,0,.12);letter-spacing:.3px;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--SHH)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-out{width:100%;padding:12px;background:transparent;color:var(--P);border:2px solid var(--P);border-radius:var(--BR);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-out:hover{background:var(--P);color:#fff}

/* QUIZ TOP */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quser{font-size:13px;font-weight:600;color:var(--MUTED)}
.quser strong{color:var(--P)}
.timer{background:var(--P);color:#fff;padding:5px 15px;border-radius:50px;font-size:17px;font-weight:800;font-family:'Urbanist',monospace;min-width:66px;text-align:center;transition:background .3s}
.timer.warn{background:#E74C3C}

/* PROGRESS */
.prog-w{margin-bottom:16px}
.prog-m{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--MUTED);margin-bottom:6px}
.prog-bg{height:9px;background:var(--BORDER);border-radius:50px;overflow:hidden}
.prog-f{height:100%;background:linear-gradient(90deg,var(--P),var(--A));border-radius:50px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* QUESTION */
.qbadge{display:inline-block;background:var(--P);color:#fff;padding:3px 13px;border-radius:50px;font-size:12px;font-weight:700;margin-bottom:9px}
.qcat{font-size:11px;color:var(--MUTED);margin-bottom:7px;font-weight:700}
.qtext{font-size:19px;font-weight:600;color:var(--TEXT);line-height:1.75;margin-bottom:16px}
.q-svg{display:block;width:min(100%,390px);height:auto;margin:14px auto 18px;overflow:visible;filter:drop-shadow(0 12px 18px rgba(15,23,42,.10))}
.q-svg text{font-family:inherit;letter-spacing:0}
.q-svg .edge{stroke-linecap:round;stroke-linejoin:round}
.q-svg .soft-label{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.fbox{background:#F1F5FA;border-left:5px solid var(--A);border-radius:var(--RS);padding:16px 26px;text-align:center;font-size:30px;font-weight:800;color:var(--P);letter-spacing:4px;margin-bottom:16px;font-family:'Urbanist',monospace;line-height:1.35}

/* OX */
.ox-g{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ox-btn{padding:24px 8px;border:3px solid var(--BORDER);border-radius:var(--R);text-align:center;cursor:pointer;font-size:48px;transition:all .2s;background:#fff;user-select:none}
.ox-btn:hover{border-color:var(--P);transform:scale(1.04)}
.ox-btn.s-o{border-color:#27AE60;background:#EAFAF1}
.ox-btn.s-x{border-color:#E74C3C;background:#FDEDEC}

/* MULTIPLE CHOICE */
.mc-l{display:flex;flex-direction:column;gap:8px}
.mc-i{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid var(--BORDER);border-radius:var(--RS);cursor:pointer;transition:all .2s;background:#fff}
.mc-i:hover{border-color:var(--P);background:#FFF5F9}
body.mid .mc-i:hover{background:#EEF3FF}
.mc-i.on{border-color:var(--P);background:color-mix(in srgb,var(--P) 8%,white)}
.mc-n{width:28px;height:28px;border-radius:50%;background:var(--BORDER);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;transition:all .2s}
.mc-i.on .mc-n{background:var(--P);color:#fff}
.mc-t{font-size:15px;font-weight:500}

/* SHORT ANSWER */
.sa-in{width:100%;padding:14px 16px;border:2px solid var(--BORDER);border-radius:var(--RS);font-size:24px;font-weight:800;text-align:center;font-family:'Urbanist',monospace;color:var(--P);outline:none;transition:border-color .2s,box-shadow .2s}
.sa-in:focus{border-color:var(--P);box-shadow:0 0 0 3px color-mix(in srgb,var(--P) 14%,transparent)}

/* FEEDBACK */
.fb-mask{position:fixed;inset:0;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.fb-mask.on{opacity:1;pointer-events:auto}
.fb-icon{font-size:100px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ============ RESULTS ============ */
/* summary bar */
.res-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--P);border-radius:var(--R) var(--R) 0 0;overflow:hidden;margin-bottom:0}
.rb-item{padding:14px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.2)}
.rb-item:last-child{border-right:none}
.rb-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.rb-val{font-size:15px;font-weight:800;color:#fff}

/* grade banner */
.grade-banner{border-radius:0 0 var(--R) var(--R);padding:18px;text-align:center;font-size:20px;font-weight:800;color:var(--P);background:color-mix(in srgb,var(--P) 10%,white);border:2px solid color-mix(in srgb,var(--P) 25%,white);border-top:none;margin-bottom:16px}
.weak-box{display:none;margin:-4px 0 16px;padding:12px 14px;border-radius:var(--RS);background:#FFF3CD;border:2px solid #FFE08A;color:#856404;font-size:14px;font-weight:800;line-height:1.55;white-space:pre-line}

/* question log */
.log-h{font-size:14px;font-weight:800;color:var(--P);margin-bottom:14px}

.idle-nudge{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:50;max-width:min(680px,calc(100vw - 32px));padding:16px 20px;border-radius:22px;background:linear-gradient(135deg,#FFF7D6,#FFE8F1);border:2px solid #FFD166;box-shadow:0 16px 40px rgba(234,88,12,.18);color:#594100;font-weight:900;font-size:18px;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:.25s}
.idle-nudge.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 문항 카드 */
.log-card{border-radius:var(--RS);border:2px solid #F0F4F8;padding:13px 14px;margin-bottom:10px;transition:box-shadow .2s;background:#fff}
.log-card:last-child{margin-bottom:0}
.log-card.ok{border-color:#C8F5D8;background:#F5FFF9}
.log-card.ng{border-color:#F5B7B1;background:#FFF1F2;box-shadow:0 8px 22px rgba(231,76,60,.10)}
.log-card.ng .log-q{background:#FFF5F5;border:1px solid #FADBD8;border-radius:8px;padding:7px 9px;color:#922B21}

/* 카드 헤더 */
.log-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ln{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;background:#F0F4F8;color:var(--MUTED)}
.log-card.ok .ln{background:#27AE60;color:#fff}
.log-card.ng .ln{background:#E74C3C;color:#fff}
.log-type-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:30px;letter-spacing:.3px}
.log-card.ok .log-type-badge{background:#C8F5D8;color:#1E8449}
.log-card.ng .log-type-badge{background:#FADBD8;color:#C0392B}
.log-cat{font-size:11px;color:var(--MUTED);font-weight:600;margin-left:auto}
.log-chk{font-size:22px;flex-shrink:0}

/* 문제 내용 */
.log-q{font-size:13px;font-weight:700;color:var(--TEXT);line-height:1.6;margin-bottom:6px;word-break:break-all}
.log-svg-q{word-break:normal;overflow:hidden}
.log-svg-q .q-svg,.log-svg-q svg{display:block;width:min(100%,230px)!important;max-width:230px!important;max-height:165px!important;height:auto!important;margin:4px auto 8px!important;overflow:visible}
.log-svg-q text{font-size:clamp(10px,3.2vw,15px)}
.log-formula{font-size:15px;font-weight:800;color:var(--P);background:color-mix(in srgb,var(--P) 8%,white);border-radius:6px;padding:5px 10px;margin-bottom:6px;letter-spacing:1px;font-family:'Urbanist',monospace;word-break:break-all}

/* 답안 행 */
.log-ans-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.log-ans-box{flex:1;min-width:100px;border-radius:7px;padding:6px 10px}
.log-ans-box.my{background:#F4F6F8;border:1.5px solid #D8DCE4}
.log-ans-box.correct{background:#EAFAF1;border:1.5px solid #A9DFBF}
.log-card.ng .log-ans-box.my{background:#FDEDEC;border-color:#E74C3C}
.log-ans-lbl{font-size:10px;font-weight:800;color:var(--MUTED);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.log-ans-val{font-size:15px;font-weight:800;color:var(--TEXT);word-break:break-all}
.log-card.ng .log-ans-box.my .log-ans-val{color:#C0392B}
.log-ans-box.correct .log-ans-val{color:#1E8449}

/* 소요시간 */
.log-elapsed{font-size:11px;color:var(--MUTED);margin-top:6px;text-align:right;font-weight:600}

/* Google Sheets */
.sh-url{width:100%;padding:11px 13px;border:2px solid var(--BORDER);border-radius:var(--RS);font-size:13px;font-family:inherit;outline:none;margin-bottom:9px;transition:border-color .2s}
.sh-url:focus{border-color:var(--P)}

/* Toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:#2D3436;color:#fff;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:700;z-index:999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#27AE60}
.toast.err{background:#E74C3C}

/* Spinner */
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}

/* Fade */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .4s ease forwards}

/* Confetti */
.conf{position:fixed;border-radius:2px;animation:fall linear forwards;z-index:300;pointer-events:none}
@keyframes fall{from{transform:translateY(-16px) rotate(0deg);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Misc */
.hidden{display:none!important}
.sec-t{font-size:14px;font-weight:800;color:var(--P);margin-bottom:10px}
@media(max-width:480px){
  .grade-g{grid-template-columns:repeat(4,1fr)}
  .row2{grid-template-columns:1fr}
  .fbox{font-size:24px;padding:12px 16px;letter-spacing:2px}
  .res-bar{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="fb-mask" id="fbMask"><div class="fb-icon" id="fbIcon"></div></div>

<!-- ===== PAGE 1 : 로그인 ===== -->
<div class="page on" id="p1">
<div class="wrap">
    <div class="logo">
    <div class="logo-mark-wrap">
      <svg class="logo-mark" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" focusable="false"><rect x="2" y="2" width="44" height="44" rx="14" fill="var(--P)"/><path d="M24 12 L35 33 L13 33 Z" fill="#fff" opacity=".95"/><circle cx="24" cy="25" r="4.5" fill="var(--A)"/></svg>
      <div class="logo-txt" id="lt">금정수학 <span>MATH</span></div>
    </div>
  </div>
  <div class="card fade">
    <div class="pg-h">📋 학생 정보 입력</div>
    <div class="pg-s">모든 항목을 입력하고 퀴즈를 시작하세요!</div>
    <div class="row2">
      <div class="fg"><label for="iNm">👤 학생 이름</label><input id="iNm" type="text" placeholder="예: 홍길동" autocomplete="off"></div>
      <div class="fg"><label for="iSch">🏫 학교명</label><input id="iSch" type="text" placeholder="예: 금정초등학교" autocomplete="off"></div>
    </div>
    <div class="fg">
      <div class="lbl">📚 학년 선택</div>
      <div class="grade-g" id="gradeG">
        <div class="gb" data-g="초3">초3</div><div class="gb" data-g="초4">초4</div>
        <div class="gb" data-g="초5">초5</div><div class="gb" data-g="초6">초6</div>
        <div class="gb" data-g="중1">중1</div><div class="gb" data-g="중2">중2</div>
        <div class="gb" data-g="중3">중3</div>
      </div>
    </div>
    <div id="semG" class="fg hidden">
      <div class="lbl">📅 학기 선택</div>
      <div class="sem-g">
        <div class="sb" data-s="1학기">1학기</div>
        <div class="sb" data-s="2학기">2학기</div>
      </div>
    </div>
    <div id="chapG" class="fg hidden">
      <div class="lbl">🎯 단원 선택</div>
      <div class="chap-l" id="chapL"></div>
    </div>
    <button class="btn" id="startBtn" onclick="startQuiz()" disabled>🚀 퀴즈 시작하기!</button>
  </div>
</div>
</div>

<!-- ===== PAGE 2 : 퀴즈 ===== -->
<div class="page" id="p2">
<div class="wrap">
  <div class="quiz-brand">
        <div class="quiz-brand-left">
      <svg class="logo-mark" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true" focusable="false"><rect x="2" y="2" width="44" height="44" rx="14" fill="var(--P)"/><path d="M24 12 L35 33 L13 33 Z" fill="#fff" opacity=".95"/><circle cx="24" cy="25" r="4.5" fill="var(--A)"/></svg>
      <div class="quiz-brand-name" id="quizBrandText">금정수학 <span>MATH</span></div>
    </div>
    <div class="quiz-brand-badge">개념 퀴즈</div>
  </div>
  <div class="qtop">
    <div class="quser"><strong id="qNm"></strong><span id="qInfo"></span></div>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div class="prog-w">
    <div class="prog-m"><span id="progLbl">문항 1/10</span><span id="progSc">점수: 0</span></div>
    <div class="prog-bg"><div class="prog-f" id="progF" style="width:0%"></div></div>
  </div>
  <div class="card fade" id="qCard">
    <div class="qbadge" id="qBadge">문항 1</div>
    <div class="qcat" id="qCat"></div>
    <div class="qtext" id="qText"></div>
    <div id="fBox" class="fbox hidden"></div>
    <div id="ansBox"></div>
    <button class="btn" id="subBtn" onclick="submitAns()" disabled style="margin-top:16px">✅ 정답 제출하기</button>
  </div>
</div>
</div>

<!-- ===== PAGE 3 : 결과 ===== -->
<div class="page" id="p3">
<div class="wrap">
    <div class="logo">
    <div class="logo-mark-wrap">
      <svg class="logo-mark" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true" focusable="false"><rect x="2" y="2" width="44" height="44" rx="14" fill="var(--P)"/><path d="M24 12 L35 33 L13 33 Z" fill="#fff" opacity=".95"/><circle cx="24" cy="25" r="4.5" fill="var(--A)"/></svg>
      <div class="logo-txt" id="lt2">금정수학 <span>MATH</span></div>
    </div>
  </div>

  <!-- 요약 바 + 등급 배너 -->
  <div>
    <div class="res-bar" id="resBar">
      <div class="rb-item"><div class="rb-lbl">학년/학기</div><div class="rb-val" id="rGrade">-</div></div>
      <div class="rb-item"><div class="rb-lbl">단원</div><div class="rb-val" id="rChap" style="font-size:11px">-</div></div>

const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

// SVG/HTML 제거 후 순수 텍스트만 추출 — 구글 시트/로그 저장용
function cleanQ(s){
  if(!s) return '';
  let text = s;
  const hasSVG = /<svg/i.test(text);
  text = text.replace(/<svg[\s\S]*?<\/svg>/gi, '');
  text = text.replace(/<br\s*\/?>/gi, ' ');
  text = text.replace(/<\/?(b|strong)>/gi, '');
  text = text.replace(/<[^>]+>/g, '');
  text = text.replace(/\s+/g, ' ').trim();
  if(hasSVG && text) return '[그림] ' + text;
  return text || '(그림 문제)';
}

function canonicalQText(s){
  return cleanQ(s).replace(/^\[그림\]\s*/, '').replace(/\s+/g, ' ').trim();
}




// 계수 1/-1 생략 헬퍼: coeff(1)='' coeff(-1)='-' coeff(2)='2'
function coeff(a){
  if(a===1) return '';
  if(a===-1) return '-';
  return String(a);
}
// 선형함수 표현식 만들기: y = ax+b 형태 (1 생략 적용)
function linStr(a,b){
  const ax = coeff(a)+'x';
  const bs = b>0 ? ` + ${b}` : b<0 ? ` - ${Math.abs(b)}` : '';
  return `y = ${ax}${bs}`;
}
// 이차함수 표현식: ax²
function quadStr(a){ return `${coeff(a)}x²`; }
function questionFamily(q){
  const text=canonicalQText(q?.q||'')
    .replace(/\d+(?:\.\d+)?/g,'#')
    .replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g,'')
    .replace(/\s+/g,' ')
    .slice(0,90);
  return `${q?.cat||'기타'}|${q?.type||'SA'}|${text}`;
}

function spreadSimilar(items,keyFn){
  const left=[...items], out=[];
  while(left.length){
    const prev=out.length ? keyFn(out[out.length-1]) : '';
    let idx=left.findIndex(q=>keyFn(q)!==prev);
    if(idx<0) idx=0;
    out.push(left.splice(idx,1)[0]);
  }
  return out;
}

function arrangeDiverse(items){
  const left=[...items], out=[];
  while(left.length){
    const prev=out[out.length-1];
    let idx=-1;
    if(prev){
      idx=left.findIndex(q=>(q?.cat||'')!==(prev?.cat||'') && (q?.type||'')!==(prev?.type||''));
      if(idx<0) idx=left.findIndex(q=>(q?.cat||'')!==(prev?.cat||''));
      if(idx<0) idx=left.findIndex(q=>(q?.type||'')!==(prev?.type||''));
      if(idx<0) idx=left.findIndex(q=>questionFamily(q)!==questionFamily(prev));
    }
    if(idx<0) idx=0;
    out.push(left.splice(idx,1)[0]);
  }
  return out;
}

function balancedQuiz(arr,limit=10){
  const pool=sh((arr||[]).filter(Boolean));
  const groups=new Map();
  pool.forEach(q=>{
    const key=questionFamily(q);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(q);
  });
  const buckets=sh([...groups.values()].map(g=>sh(g)));
  const picked=[];
  while(picked.length<limit && buckets.some(g=>g.length)){
    for(const g of buckets){
      if(g.length && picked.length<limit) picked.push(g.shift());
    }
  }
  const used=new Set(picked);
  for(const q of pool){
    if(picked.length>=limit) break;
    if(!used.has(q)) picked.push(q);
  }
  return arrangeDiverse(spreadSimilar(picked,(q)=>questionFamily(q)));
}

// 문항 풀 10개 선택 후 타입/유형 교차 배열
function mixTypes(arr){
  return arrangeDiverse(balancedQuiz(arr,10));

function quizSig(q){
  return [q?.type||'', q?.cat||'', canonicalQText(q?.q||''), q?.f||'', q?.a||''].join('|');

function buildQuizFromGenerator(makeQuiz, target=10){
  const unique=[], seen=new Set();
  for(let i=0;i<20 && unique.length<target;i++){
    const batch=Array.isArray(makeQuiz()) ? makeQuiz() : [];
    batch.forEach(q=>{
      const sig=quizSig(q);
      if(!seen.has(sig)){
        seen.add(sig);
        unique.push(q);
      }
    });
  }
  return mixTypes(unique).slice(0,target).map(sanitizeQuizVisualAnswer);
}
function escapeRegExpText(s){
  return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}
function replaceAnswerInsideSvg(src, answer){
  if(!src || !answer) return src;
  const ans = String(answer).trim();
  if(!ans || /^[oxOX○×]$/.test(ans)) return src;
  const re = new RegExp(escapeRegExpText(ans),'g');
  return String(src).replace(/<svg[\s\S]*?<\/svg>/gi, svg => svg.replace(re,'?'));
}
function sanitizeQuizVisualAnswer(q){
  if(!q) return q;
  const ans = String(q.answer ?? q.a ?? '').trim();
  if(!ans) return q;
  const body = String(q.q || '');
  if(/띠그래프|원그래프/.test(body)) return q;
  const next = {...q};
  if(next.q) next.q = replaceAnswerInsideSvg(next.q, ans);
  if(next.visual) next.visual = replaceAnswerInsideSvg(next.visual, ans);
  return next;
}
function gcd(a,b){return b?gcd(b,a%b):a;}
function lcm(a,b){return a*b/gcd(a,b);}
function pfStr(n){const f={};let d=2;while(n>1){while(n%d===0){f[d]=(f[d]||0)+1;n/=d;}d++;}return Object.entries(f).map(([p,e])=>e===1?p:`${p}^${e}`).join('×');}
// HTML escape + ^N → <sup>N</sup>
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderF(s){return escH(s).replace(/\^(\d+)/g,'<sup>$1</sup>');}
// SVG/HTML 포함 문장 렌더링 — SVG 태그는 이스케이프하지 않음
// 주의: 이 함수이름은 renderQText — renderQ()는 문제 화면 렌더 함수로 배정해 충돌 회피
function renderQText(s){
  if(!s) return '아래 식을 계산하세요.';
  if(s.includes('<svg') || s.includes('<img') || s.includes('<br')) return s.replace(/\^(\d+)/g,'<sup>$1</sup>');
  return renderF(s);
}
// 답안 정규화: 공백제거, ×/x 통일, ^N 통일 → 대소문자 무시
// + 숫자형 정규화: "1.00" == "1", "2.50" == "2.5"
function evalSimpleMathAnswer(str){
  let expr=String(str)
    .replace(/파이|π|pi/g,'π')
    .replace(/(\d|\))π/g,'$1×π')
    .replace(/π(\d|\()/g,'π×$1')
    .replace(/π/g,'3.14')
    .replace(/도|°|˚|º/g,'')
    .replace(/[×x]/gi,'*')
    .replace(/÷/g,'/')
    .replace(/−/g,'-');
  if(!/^[0-9.+\-*/()]+$/.test(expr) || !/\d/.test(expr)) return null;
  try{
    const val=Function('"use strict";return ('+expr+')')();
    if(typeof val !== 'number' || !isFinite(val)) return null;
    return String(parseFloat(val.toFixed(10)));
  }catch(e){
    return null;
  }
}

function stripNumericAnswerUnit(str){
  const unitPattern = '(?:cm\\^?2|mm\\^?2|km\\^?2|m\\^?2|cm2|mm2|km2|m2|cm²|mm²|km²|m²|㎠|㎡|cm\\^?3|mm\\^?3|km\\^?3|m\\^?3|cm3|mm3|km3|m3|cm³|mm³|km³|m³|㎤|㎥|cm|mm|km|m|㎝|㎜|㎞|kg|mg|g|t|ton|ml|dl|cl|kl|l|ℓ|㎏|㎎|㎍|㎖|㎗|㎘|도|°|원|개|명|권|쪽|분|초|시간|센티미터|밀리미터|킬로미터|미터|킬로그램|밀리그램|마이크로그램|그램|톤|리터|밀리리터|데시리터|센티리터|킬로리터|제곱센티미터|제곱밀리미터|제곱킬로미터|제곱미터|세제곱센티미터|세제곱밀리미터|세제곱킬로미터|세제곱미터)';
  const unitRe = new RegExp('([0-9π이\\)])' + unitPattern + '$', 'i');
  let out = String(str);
  let prev;
  do{
    prev = out;
    out = out.replace(unitRe, '$1');
  }while(out !== prev);
  return out;
}
// 답안 정규화: 공백제거, ×/x 통일, ^N 통일 + 대소문자 무시
// + 숫자 정규화: "1.00" == "1", "2.50" == "2.5"
// + 한글 단위/기호: "25도" == "25°" == "25", "6파이" == "6π" == "18.84"
function normAns(s){
  let str=String(s).trim()
    .replace(/\s+/g,'')
    .replace(/[\u00d7x]/gi,'×')
    .replace(/[˚º]/g,'°')
    .replace(/\^(\d)/g,'^$1')
    .replace(/%$/,'')
    .toLowerCase();
  // 한국어 예/아니오 → true/false
  if(['네','예','맞다','맞아','그렇다','옳다','맞아요','맞습니다','예요','맞어'].includes(str)) str='true';
  if(['아니오','아니요','아니다','아니야','틀리다','틀려','아닙니다','아니에요'].includes(str)) str='false';
  const mathValue = evalSimpleMathAnswer(str);
  if(mathValue !== null) return mathValue;
  str = stripNumericAnswerUnit(str);
  const unitMathValue = evalSimpleMathAnswer(str);
  if(unitMathValue !== null) return unitMathValue;
  str=str.replace(/^(-?\d+(?:\.\d+)?)(?:도|°)$/,'$1');
  // 순수 숫자(소수 포함)면 parseFloat로 정규화해서 후행 0 제거
  if(/^-?\d+(\.\d+)?$/.test(str)) str=String(parseFloat(str));
  return str;
}

/* ============================================================
   flexEqCheck — 대응관계 식 동치 체크
   △×2=○ 와 시간×2=거리, A×2=B, x×2=y 등을
   "구조"가 같으면 정답으로 인정
   정답(correct)은 ○=△×N 또는 ○=△+N 형태
============================================================ */
function flexEqCheck(userAns, correctAns){
  // 1) 우선 normAns로 직접 비교
  if(normAns(userAns) === normAns(correctAns)) return true;

  // 2) 식 구조 분석 함수: 식에서 [좌변기호, 연산자, 숫자, 우변기호] 추출
  // 지원 형태: A=B×N, A=B+N, A×N=B, A+N=B (기호는 임의 문자)
  function parseEqStructure(expr){
    // 공백/곱셈기호 정규화
    let e = expr.replace(/\s+/g,'').replace(/[×x\*]/gi,'×').replace(/[÷\/]/g,'÷');
    // = 기준 분리
    const eqParts = e.split('=');
    if(eqParts.length !== 2) return null;
    const [lhs, rhs] = eqParts;
    // 한쪽이 순수 숫자인 값 구하기 문제는 flex 대상 아님
    if(/^-?[\d.]+$/.test(lhs) || /^-?[\d.]+$/.test(rhs)) return null;

    // 곱셈: sym×num 또는 num×sym
    const multPat = /^([^×÷+\-\d][^×÷]*?)×([\d.]+)$|^([\d.]+)×([^×÷+\-\d][^×÷]*?)$/;
    // 덧셈: sym+num
    const addPat  = /^([^+\-\d][^+]*?)\+([\d.]+)$|^([\d.]+)\+([^+\-\d][^+]*?)$/;

    function tryParse(side){
      let m;
      m = side.match(/^([^×÷+\-\d].*)×([\d.]+)$/);
      if(m) return {sym: m[1].trim(), op:'×', num: m[2]};
      m = side.match(/^([\d.]+)×([^×÷+\-\d].*)$/);
      if(m) return {sym: m[2].trim(), op:'×', num: m[1]};
      m = side.match(/^([^+\-\d].*)\+([\d.]+)$/);
      if(m) return {sym: m[1].trim(), op:'+', num: m[2]};
      m = side.match(/^([\d.]+)\+([^+\-\d].*)$/);
      if(m) return {sym: m[2].trim(), op:'+', num: m[1]};
      // 순수 기호(변수)
      if(/^[^\d×÷+\-][^×÷+\-]*$/.test(side)) return {sym: side.trim(), op:null, num:null};
      return null;
    }

    const L = tryParse(lhs), R = tryParse(rhs);
    if(!L || !R) return null;
    // 연산이 있는 쪽과 단순 기호 쪽 구분
    if(L.op && !R.op) return {opSide:'left',  op:L.op, num:L.num, inputSym:L.sym, outputSym:R.sym};
    if(!L.op && R.op) return {opSide:'right', op:R.op, num:R.num, inputSym:R.sym, outputSym:L.sym};
    return null;
  }

  const cs = parseEqStructure(correctAns);
  const us = parseEqStructure(userAns);

  if(!cs || !us) return false;

  // 구조 비교: 연산자, 숫자가 같으면 기호 이름은 달라도 OK
  return cs.op === us.op && String(cs.num) === String(us.num);
}

// ── 학년별 말투 헬퍼 ─────────────────────────────────────────────
// 초등: 친근한 ~해요 말투 + 이모지
// 중등: 학술적 ~하시오 / ~구하여라 말투
function qElem(text){ return text; }  // 초등 문장 (이미 ~어요 형태)
function qMid(text){ return text; }   // 중등 문장 (이미 ~하시오 형태)
function saElem(q,a,cat,f){ return SA(q,a,cat,f); }
function saMid(q,a,cat,f){
  // 중등 주관식: ~의 값을 구하여라 / ~을 구하시오 말투
  const q2 = q.replace(/인가요\?$/,'인지 구하여라.').replace(/는\?$/,' 구하시오.').replace(/은\?$/,' 구하시오.');
  return SA(q2,a,cat,f);
}
function stMid(q,a,cat,f){
  // 중등 문장제: ~이다. ~일 때, ... 구하시오.
  return ST(q,a,cat,f);
}

// Question factories
const OX=(q,a,cat="개념")=>({type:"OX",q,a:a?"O":"X",cat,f:""});
function numChoices4(ans, candidates){
  const out=[];
  [ans, ...(candidates||[])].forEach(v=>{
    const s=String(v);
    if(!out.includes(s)) out.push(s);
  });
  let step=1;
  while(out.length<4){
    [ans+step, ans-step, ans+step*2].forEach(v=>{
      const s=String(v);
      if(out.length<4 && v>0 && !out.includes(s)) out.push(s);
    });
    step++;
  }
  return out.slice(0,4);
}
function uniqueChoices(ch, ans){
  const out=[];
  for(const v of [ans, ...ch]){
    const s=String(v);
    if(!out.includes(s)) out.push(s);
  }
  const ansNum = Number(String(ans).replace(/,/g,''));
  if(Number.isFinite(ansNum)){
    let step=1;
    while(out.length<4 && step<20){
      [ansNum+step, ansNum-step, ansNum+step*2, ansNum-step*2].forEach(v=>{
        const s=String(v);
        if(out.length<4 && !out.includes(s)) out.push(s);
      });
      step++;
    }
  }
  const fillers=["0","1","2","3","4","-1","해당 없음","판단할 수 없음"];
  fillers.forEach(v=>{ if(out.length<4 && String(v)!==String(ans) && !out.includes(String(v))) out.push(String(v)); });
  return out;
}
const MC=(q,ch,a,cat="계산",f="")=>({type:"MC",q,choices:sh(uniqueChoices(ch,a)),a:String(a),cat,f});
const SA=(q,a,cat="계산",f="")=>({type:"SA",q,a:String(a),cat,f});
const ST=(q,a,cat,f)=>SA(q,a,cat,f); // story problem alias

    <polygon points="90,8 15,112 165,112" fill="rgba(99,102,241,0.08)" stroke="#6366F1" stroke-width="2.5"/>
    <text x="86" y="22" font-size="12" fill="#6366F1" text-anchor="middle">${a1}°</text>
    <text x="22" y="112" font-size="12" fill="#6366F1">${a2}°</text>
    <text x="152" y="112" font-size="12" fill="#EF4444">${a3}°</text>
  </svg>`;
}
function svgAngleLine(deg, color='#6366F1'){
  const rad = deg * Math.PI / 180;
  const x2 = Math.round(80 + 60*Math.cos(-rad)), y2 = Math.round(70 - 60*Math.sin(-rad));
  return `<svg width="140" height="100" viewBox="0 0 140 100" style="display:block;margin:8px auto">
    <line x1="20" y1="70" x2="120" y2="70" stroke="${color}" stroke-width="2"/>
    <line x1="20" y1="70" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2"/>
    <path d="M 45,70 A 25,25 0 0,1 ${20+25*Math.cos(-rad)},${70-25*Math.sin(-rad)}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <text x="50" y="60" font-size="13" fill="${color}" font-weight="bold">${deg}°</text>
  </svg>`;
}

// ── 초5: 분수의 덧셈과 뺄셈 ──────────────────────────────
function g_fracadd4(){
  const p=[];
  p.push(OX("분모가 같은 분수는 분자끼리 더한다.",true));
  p.push(OX("분모가 같은 분수의 뺄셈은 분모는 그대로 두고 분자끼리 뺀다.",true));
  p.push(OX("1/5 + 2/5 = 3/10 이다.",false));
  p.push(OX("4/7 - 1/7 = 3/7 이다.",true));
  p.push(OX("분모가 같은 분수의 덧셈에서 분모도 함께 더한다.",false));
  const dens=[4,5,6,7,8,9,10,12];
  for(let i=0;i<5;i++){
    const d=rc(dens), n1=ri(1,d-2), n2=ri(1,d-n1-1), sum=n1+n2;
    const g2=gcd(sum,d), ans=(sum%d===0)?String(sum/d):`${sum/g2}/${d/g2}`;
    p.push(SA(`${n1}/${d} + ${n2}/${d} = ?`,ans,"분수덧셈",`${n1}/${d} + ${n2}/${d}`));
  }
  for(let i=0;i<5;i++){
    const d=rc(dens), n1=ri(2,d-1), n2=ri(1,n1-1), diff=n1-n2;
    const g2=gcd(diff,d), ans=(diff%d===0)?String(diff/d):`${diff/g2}/${d/g2}`;
    p.push(SA(`${n1}/${d} - ${n2}/${d} = ?`,ans,"분수뺄셈",`${n1}/${d} - ${n2}/${d}`));
  }
  const n=rc(NAMES),d=rc([6,8,10]),v1=ri(1,Math.floor(d/2)),v2=ri(1,d-v1-1);
  const sumN=v1+v2, sumG=gcd(sumN,d);
  const fracAns=(sumN%d===0)?String(sumN/d):`${sumN/sumG}/${d/sumG}`;
  p.push(ST(`🍕 ${n}이(가) 피자 ${v1}/${d}판을 먹고 ${v2}/${d}판을 더 먹었어요. 모두 얼마를 먹었나요?`,fracAns,"문장제"));
  return balancedQuiz(p);
}

function g_fracadd5(){
  const p=[];
  p.push(OX("분모가 다른 분수는 통분 후 계산한다.",true));
  p.push(OX("1/2 + 1/3 = 2/5 이다.",false));
  p.push(OX("3/4 − 1/4 = 1/2 이다.",true));
  p.push(OX("분수의 덧셈에서 분모끼리 더하면 안 된다.",true));
  const pairs=[[2,3],[3,4],[4,6],[2,5],[3,6]];
  for(let i=0;i<4;i++){
    const [d1,d2]=rc(pairs),n1=ri(1,d1-1),n2=ri(1,d2-1);
    const l=lcm(d1,d2),ns=n1*(l/d1)+n2*(l/d2);
    const g2=gcd(ns,l);
    p.push(SA(`${n1}/${d1} + ${n2}/${d2} = ?`,l===g2?String(ns/g2):`${ns/g2}/${l/g2}`,"분수덧셈",`${n1}/${d1} + ${n2}/${d2}`));
  }
  for(let i=0;i<3;i++){
    const [d1,d2]=rc(pairs),n1=ri(2,d1),n2=ri(1,d2-1);
    const l=lcm(d1,d2),ns=n1*(l/d1)-n2*(l/d2);
    if(ns<=0)continue;
    const g2=gcd(ns,l);
    p.push(SA(`${n1}/${d1} - ${n2}/${d2} = ?`,`${ns/g2}/${l/g2}`,"분수뺄셈",`${n1}/${d1} - ${n2}/${d2}`));
  }
  // 피자 문장제 — 답은 항상 분수 형식 (가분수 허용, 소수 X)
  const n=rc(NAMES),d=rc([4,6,8]),v1=ri(1,d-1),v2=ri(1,d-1);
  const sumN=v1+v2, sumG=gcd(sumN,d);
  const fracAns = (sumN%d===0) ? String(sumN/d) : `${sumN/sumG}/${d/sumG}`;
  p.push(ST(`🍕 피자 한 판의 ${v1}/${d}을 먹고 나중에 ${v2}/${d}을 더 먹었어요. 모두 몇 분의 몇?`,fracAns,"문장제"));
  return balancedQuiz(p);
}

  for(let i=0;i<5;i++){const r=ri(2,10);p.push(SA(`반지름 ${r}cm인 원의 둘레는? (π=3.14, 소수 둘째자리)`,(2*r*3.14).toFixed(2),"원둘레",`2×${r}×3.14`));}

// ── 초5 분수의 곱셈 ─────────────────────────────────────────────────
function g_fracmult5(){
  const p=[];
  // OX
  p.push(OX("분수의 곱셈은 분자끼리, 분모끼리 곱한다.",true));
  p.push(OX("1/2 × 1/3 = 1/6 이다.",true));

  p.push(OX("3 × 1/4 = 3/4 이다.",true));
  p.push(OX("2/5 × 5/2 = 2 이다.",false));

  // SA — 단위분수 × 단위분수
  const ufs=[[2,3],[2,5],[3,4],[3,5],[4,5],[2,7],[3,7]];
  for(let i=0;i<3;i++){
    const [a,b]=rc(ufs);
    p.push(SA(`계산하세요: 1/${a} × 1/${b}`,`1/${a*b}`,"분수×분수",`분자:1×1, 분모:${a}×${b}`));
  }
  // SA — 진분수 × 진분수
  const fracs2=[[1,2,1,3],[2,3,3,4],[1,4,2,3],[3,5,5,6],[2,5,1,2],[1,3,3,5]];
  for(let i=0;i<3;i++){
    const [a,b,c,d]=rc(fracs2);
    const pn=a*c, pd=b*d, g=gcd(pn,pd);
    const rn=pn/g, rd=pd/g;
    const ans=rd===1?String(rn):`${rn}/${rd}`;
    p.push(SA(`계산하세요: ${a}/${b} × ${c}/${d}`,ans,"분수×분수",`${pn}/${pd} = ${ans}`));
  }
  // SA — 자연수 × 분수
  for(let i=0;i<3;i++){
    const n=ri(2,8), a=ri(1,5), b=ri(a+1,9);
    const pn=n*a, g=gcd(pn,b);
    const rn=pn/g, rd=b/g;
    const ans=rd===1?String(rn):(rn>=rd?`${Math.floor(rn/rd)} ${rn%rd}/${rd}`:`${rn}/${rd}`);
    p.push(SA(`계산하세요: ${n} × ${a}/${b}`,ans,"자연수×분수",`${n}×${a}/${b}`));
  }
  // MC
  p.push(MC("2/3 × 3/2 = ?",["1","2/3","4/9","6/6"],"1","분수×분수"));
  p.push(MC("4 × 3/4 = ?",["3","4/3","1","12/4"],"3","자연수×분수"));

  // 문장제
  for(let i=0;i<2;i++){
    const nm=rc(NAMES), a=ri(1,4), b=ri(a+1,8);
    const km=rc([6,8,10,12]);
    const ans=km*a/b;
    const g2=gcd(km*a,b); const rn2=(km*a)/g2, rd2=b/g2;
    const ansStr=rd2===1?String(rn2):`${rn2}/${rd2}`;
    p.push(ST(`${eq()} ${nm}이(가) 전체 ${km}km의 ${a}/${b}만큼 걸었어요. 몇 km 걸었을까요?`,ansStr,"문장제",`${km}×${a}/${b}`));
  }
  return balancedQuiz(p);
}

// ── 초5 혼합계산 ────────────────────────────────────────────────────
function g_mixed5(){
  const p=[];

  // OX 개념
  p.push(OX("혼합 계산에서 ( ) 안을 먼저 계산한다.",true));
  p.push(OX("×와 ÷는 +와 − 보다 먼저 계산한다.",true));
  p.push(OX("( ) 없이 +와 ×가 있으면 +를 먼저 계산한다.",false));
  p.push(OX("( ) 안에 +와 ×가 있으면 ×를 먼저 계산한다.",true));

  // SA — 괄호 없는 혼합
  for(let i=0;i<5;i++){
    const a=ri(2,9),b=ri(2,9),c=ri(2,9);
    const type=rc(['mult_add','add_mult','mult_sub']);
    let q,ans;
    if(type==='mult_add'){q=`${a} × ${b} + ${c}`;ans=a*b+c;}
    else if(type==='add_mult'){q=`${c} + ${a} × ${b}`;ans=c+a*b;}
    else{q=`${a} × ${b} − ${c}`;ans=a*b-c;}
    if(ans>0) p.push(SA(`계산하세요: ${q}`,ans,"혼합계산",`곱셈 먼저 → ${a*b}${type==='mult_sub'?` − ${c}`:(type==='mult_add'?` + ${c}`:` + ${c}`)}`));
  }
  // SA — 나눗셈 포함
  for(let i=0;i<3;i++){
    const a=ri(2,6),b=ri(2,6),c=ri(2,9);
    const q=`${a*b} ÷ ${a} + ${c}`;
    p.push(SA(`계산하세요: ${q}`,b+c,"혼합계산",`÷ 먼저 → ${b} + ${c}`));
  }
  // SA — 괄호 포함
  for(let i=0;i<4;i++){
    const a=ri(2,8),b=ri(2,8),c=ri(2,5);
    const q=`(${a} + ${b}) × ${c}`;
    p.push(SA(`계산하세요: ${q}`,(a+b)*c,"혼합계산",`괄호 먼저 → ${a+b} × ${c}`));
  }
  for(let i=0;i<3;i++){
    const a=ri(10,30),b=ri(2,8),c=ri(2,6);
    const q=`(${a} − ${b}) ÷ ${c}`;
    const ans=(a-b)/c;
    if(Number.isInteger(ans)&&ans>0) p.push(SA(`계산하세요: ${q}`,ans,"혼합계산",`괄호 먼저 → ${a-b} ÷ ${c}`));
  }

function svgBandGraph(parts, labels){
  const colors=['#F97316','#22C55E','#3B82F6','#EC4899'];
  let x=24;
  const segs=parts.map((v,i)=>{
    const w=v*2.82;
    const s=`<rect x="${x}" y="50" width="${w}" height="42" rx="${i===0?10:0}" fill="${colors[i%colors.length]}" opacity=".86"/>
      <text x="${x+w/2}" y="77" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">${v}%</text>`;
    x+=w;
    return s;
  }).join('');
  const legend=labels.map((l,i)=>`<circle cx="${38+i*76}" cy="126" r="7" fill="${colors[i%colors.length]}"/><text x="${50+i*76}" y="131" font-size="13" font-weight="800" fill="#334155">${l}</text>`).join('');
  return `<svg viewBox="0 0 340 150" class="q-svg" role="img" aria-label="띠그래프">
    <defs><filter id="bandShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#0F172A" flood-opacity=".12"/></filter></defs>
    <text x="170" y="26" text-anchor="middle" font-size="18" font-weight="900" fill="#334155">띠그래프</text>
    <rect x="24" y="50" width="282" height="42" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" filter="url(#bandShadow)"/>
    <g clip-path="inset(50px 34px 58px 24px round 10px)">${segs}</g>
    ${legend}
  </svg>`;
}
function svgPieGraph(parts, labels){
  const colors=['#F97316','#22C55E','#3B82F6','#EC4899'];
  let acc=0;
  function point(pct){
    const a=(pct/100)*Math.PI*2-Math.PI/2;
    return [132+65*Math.cos(a),80+65*Math.sin(a)];
  }
  const slices=parts.map((v,i)=>{
    const start=acc, end=acc+v; acc=end;
    const [x1,y1]=point(start), [x2,y2]=point(end);
    const large=v>50?1:0;
    return `<path d="M132 80 L${x1.toFixed(1)} ${y1.toFixed(1)} A65 65 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${colors[i%colors.length]}" opacity=".88" stroke="#fff" stroke-width="3"/>`;
  }).join('');
  const legend=labels.map((l,i)=>`<circle cx="226" cy="${44+i*25}" r="7" fill="${colors[i%colors.length]}"/><text x="239" y="${49+i*25}" font-size="13" font-weight="800" fill="#334155">${l} ${parts[i]}%</text>`).join('');
  return `<svg viewBox="0 0 340 165" class="q-svg" role="img" aria-label="원그래프">
    <defs><filter id="pieShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#0F172A" flood-opacity=".14"/></filter></defs>
    <text x="132" y="20" text-anchor="middle" font-size="18" font-weight="900" fill="#334155">원그래프</text>
    <g filter="url(#pieShadow)">${slices}<circle cx="132" cy="80" r="65" fill="none" stroke="#CBD5E1" stroke-width="2"/></g>
    ${legend}
  </svg>`;
}

  // OX 개념 — 다각형
  p.push(OX("n각형의 내각의 합 = (n-2)×180° 이다.",true));
  p.push(OX("모든 다각형의 외각의 합은 360°이다.",true));
  p.push(OX("오각형의 내각의 합은 540°이다.",true));
  p.push(OX("육각형의 내각의 합은 720°이다.",true));
  // OX 개념 — 사각형
  p.push(OX("평행사변형의 대각의 크기는 같다.",true));
  p.push(OX("평행사변형의 이웃하는 두 각의 합은 180°이다.",true));
  p.push(OX("직사각형도 평행사변형이다.",true));
  p.push(OX("마름모의 내각은 모두 90°이다.",false));
  p.push(OX("마름모의 두 대각선은 서로 수직이다.",true));

  // MC: 동위각/엇각 판별
  p.push(MC("평행선에서 같은 쪽에 있는 각을 무엇이라 하는가?",["동위각","엇각","맞꼭지각","수직각"],"동위각","평행선과각"));
  p.push(MC("평행선에서 서로 다른 쪽에 있는 교차하는 각을 뭐라 하는가?",["동위각","엇각","수직각","맞꼭지각"],"엇각","평행선과각"));
  p.push(MC("다음 중 다각형의 외각의 합은?",["360°","180°","540°","720°"],"360°","다각형외각"));

  // SA: 평행선 — 동위각/엇각으로 미지각 구하기
  for(let i=0;i<4;i++){
    const known=ri(35,140);
    p.push(SA(`평행선에서 한 각이 ${known}°일 때, 동위각의 크기는?`,known,"평행선각",`동위각 = ${known}°`));
  }
  for(let i=0;i<4;i++){
    const known=ri(35,140);
    p.push(SA(`평행선에서 한 각이 ${known}°일 때, 엇각의 크기는?`,known,"평행선각",`엇각 = ${known}°`));
  }
  for(let i=0;i<3;i++){
    const known=ri(50,130);
    p.push(SA(`한 직선 위의 이웃한 두 각 중 한 각이 ${known}°일 때, 다른 각의 크기는?`,180-known,"이웃한각",`180° - ${known}°`));
  }

  // SA: 삼각형 내각 — 나머지 한 각
  for(let i=0;i<5;i++){
    const a=ri(30,90),b=ri(20,Math.min(90,150-a));
    const c=180-a-b;
    if(c>0&&c<180)p.push(SA(`삼각형의 세 각이 ${a}°, ${b}°, □°일 때 □는?`,c,"삼각형내각",`180° - ${a}° - ${b}°`));
  }

  // SA: 외각 = 나머지 두 내각의 합
  for(let i=0;i<4;i++){
    const a=ri(35,80),b=ri(35,Math.min(80,140-a));
    p.push(SA(`삼각형에서 두 내각이 ${a}°, ${b}°일 때 외각의 크기는?`,a+b,"삼각형외각",`${a}° + ${b}°`));
  }

  // SA: 이등변삼각형
  for(let i=0;i<3;i++){
    const apex=ri(20,140);
    if((180-apex)%2===0)p.push(SA(`이등변삼각형의 꼭각이 ${apex}°일 때 밑각의 크기는?`,(180-apex)/2,"이등변삼각형",`(180°-${apex}°)÷2`));
  }
  for(let i=0;i<3;i++){
    const base=ri(40,80);
    p.push(SA(`이등변삼각형의 밑각이 각각 ${base}°일 때 꼭각의 크기는?`,180-base*2,"이등변삼각형",`180°-${base}°×2`));
  }

  // SA: 다각형 내각의 합 (n-2)×180
  const polyData=[{n:3,name:"삼각형"},{n:4,name:"사각형"},{n:5,name:"오각형"},{n:6,name:"육각형"},{n:7,name:"칠각형"},{n:8,name:"팔각형"},{n:10,name:"십각형"}];
  for(let i=0;i<4;i++){
    const poly=rc(polyData);
    p.push(SA(`${poly.name}의 내각의 합은 몇 °?`,(poly.n-2)*180,"다각형내각",`(${poly.n}-2)×180`));
  }

  // SA: 평행사변형 각도
  for(let i=0;i<3;i++){
    const ang=ri(50,130);
    p.push(SA(`평행사변형에서 한 각이 ${ang}°일 때, 이웃한 각의 크기는?`,180-ang,"평행사변형각",`180° - ${ang}°`));
  }

  // 문장제
  for(let i=0;i<3;i++){
    const nm=rc(NAMES),a=ri(40,80),b=ri(30,Math.min(80,130-a));
    p.push(ST(`${eq()} ${nm}이(가) 삼각형에서 두 각이 ${a}°, ${b}°예요. 나머지 한 각은?`,180-a-b,"문장제",`180°-${a}°-${b}°`));
  }
  for(let i=0;i<2;i++){
    const nm=rc(NAMES),apex2=rc([40,50,60,80,100,120]);
    p.push(ST(`📐 ${nm}이(가) 이등변삼각형을 그렸어요. 꼭각이 ${apex2}°일 때 밑각의 크기는?`,(180-apex2)/2,"문장제",`(180°-${apex2}°)÷2`));
  }
  for(let i=0;i<2;i++){
    const poly2=rc(polyData),nm=rc(NAMES);
    p.push(ST(`${eq()} ${nm}이(가) 정${poly2.name}의 내각의 합을 구하려 해요. 정답은?`,(poly2.n-2)*180,"문장제",`(${poly2.n}-2)×180`));
  }

  return balancedQuiz(p);
}




function svgCoordPlane(pts=[], labels=[]){
  const size=180, mid=90, scale=16;
  const grid=[-4,-3,-2,-1,1,2,3,4].map(v=>`
    <line x1="${mid+v*scale}" y1="15" x2="${mid+v*scale}" y2="165" stroke="#E2E8F0"/>

function svgLinearFunc(a,b){
  const mid=90, scale=18;
  const xVals=[];
  for(let x=-4;x<=4;x++){
    const y=a*x+b;
    if(y>=-4 && y<=4) xVals.push(x);
  }
  const minX=xVals.length ? Math.min(...xVals) : -2;
  const maxX=xVals.length ? Math.max(...xVals) : 2;
  const pad=0.4;
  const xa=Math.max(-4,minX-pad), xb=Math.min(4,maxX+pad);
  const y1=a*xa+b, y2=a*xb+b;
  const x1=mid+xa*scale, x2=mid+xb*scale;
  return `<svg width="220" height="200" viewBox="0 0 180 180" style="display:block;margin:10px auto">
    <line x1="10" y1="${mid}" x2="170" y2="${mid}" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="${mid}" y1="10" x2="${mid}" y2="170" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="${x1}" y1="${mid-y1*scale}" x2="${x2}" y2="${mid-y2*scale}" stroke="#EF4444" stroke-width="3"/>

    <text x="104" y="26" font-size="12" fill="#475569">일차함수의 그래프</text>
  </svg>`;
}

function firstNum(text, fallback='?'){
  const m = String(text || '').match(/(\d+(?:\.\d+)?)/);
  return m ? m[1] : fallback;
}

function nums(text){
  return [...String(text || '').matchAll(/(\d+(?:\.\d+)?)/g)].map(m => Number(m[1]));
}

function prependVisual(q, svg){
  if(!q || !q.q || String(q.q).includes('<svg')) return q;
  return {...q, q: svg + String(q.q)};
}

function visualForQuestion(q, unitKey){
  const t = String(q?.q || '');
  const cat = String(q?.cat || '');
  const ns = nums(t);
  const noAutoVisualUnits = new Set(['data3','figstat_m1','stat_m3_22','stat_center_m3','stat_scatter_m3','avg5','solidprop_m1','solidprop_round','solidprop_poly']);
  if(noAutoVisualUnits.has(unitKey)) return '';
  const asksShapeName = /이름은|도형은|무엇|어떤 도형|다음 중|모양은|알맞은 도형|만든 도형|생기는 도형/.test(t);
  const isShapeClassification = /분류|도형이름|정다각형|포함관계/.test(cat);
  if(asksShapeName || isShapeClassification) return '';
  if(unitKey === 'trig_m3') return svgTrigTriangle(ns.find(n => n === 30 || n === 45 || n === 60) || 45, 4, 4);
  if(unitKey === 'tri_bisector_m2'){
    if(cat.includes('거리')) return svgAngleBisectorDistance(ns[0] || '?');
    if(cat.includes('삼각형')) return svgTriangleAngleBisector();
    return svgAngleBisector(ns.find(n => n > 0 && n < 180) || 80);
  }
  if(unitKey === 'fig_m1_construct' && (cat.includes('각의이등분선') || cat.includes('각이등분선') || t.includes('각의 이등분선'))){
    if(cat.includes('거리') || t.includes('거리')) return svgAngleBisectorDistance(ns[0] || '?');
    return svgAngleBisector(ns.find(n => n > 0 && n < 180) || 80);
  }
  if(unitKey === 'prism6'){
    if(t.includes('전개도') && t.includes('옆면')) return svgSolidNetSide(t.includes('각뿔') ? '각뿔' : '각기둥');
    return t.includes('각뿔') ? svgSolidFigure('각뿔') : svgSolidFigure('각기둥');
  }
  if(unitKey === 'space6') return '';
  if(unitKey === 'cyl6') return '';
  if(/^circp/.test(unitKey)) return '';
  if(unitKey === 'cuboid5' && t.includes('전개도') && /면의 모양|옆면의 모양|이루는 면/.test(t)) return '';
  if(unitKey === 'cuboid5' && t.includes('전개도')) return svgCuboidNet(t.includes('정육면체'));
  if(unitKey === 'cuboid5' || unitKey === 'cuboidvol6') return t.includes('정육면체') ? svgSolidFigure('정육면체') : svgSolidFigure('직육면체');
  if(t.includes('직사각형') || t.includes('액자') || (t.includes('가로') && t.includes('세로'))){
    return svgRectArea(ns[0] || '?', ns[1] || '?', t.includes('액자') ? '직사각형 액자' : '직사각형');
  }
  if(t.includes('정사각형')) return svgSquareFigure(ns[0] || '?', '정사각형');
  if(t.includes('사다리꼴')) return ns.length >= 3 ? svgTrapezoidArea(ns[0],ns[1],ns[2]) : svgShapeFigure('사다리꼴');
  if(t.includes('마름모')) return t.includes('대각선') && ns.length >= 2 ? svgRhombusArea(ns[0],ns[1]) : svgShapeFigure('마름모');
  if(t.includes('평행사변형')) return t.includes('높이') && ns.length >= 2 ? svgParallelogramArea(ns[0],ns[1]) : svgShapeFigure('평행사변형');
  if(t.includes('이등변삼각형')) return svgIsosceles(ns[0] || 55, 70);
  if(t.includes('정삼각형')) return svgShapeFigure('정삼각형');
  if(t.includes('직각삼각형')) return svgRightTriangle(ns[0] || 3, ns[1] || 4, ns[2] || 5);
  if(t.includes('삼각형')){
    const isAngleQuestion = t.includes('각') || cat.includes('각');
    const isAreaQuestion = t.includes('넓이') || t.includes('밑변') || t.includes('높이');
    if(isAngleQuestion) return ns.length >= 2 && ns[0] < 180 && ns[1] < 180 ? svgTriangleAngles(ns[0], ns[1]) : svgTriangleAngles(60, 60);
    if(isAreaQuestion) return svgTriangleArea(ns[0] || '?', ns[1] || '?');
    return svgShapeFigure('삼각형');
  }
  const isCircleCalc = t.includes('cm') && (/원둘레|원넓이|원의둘레|원의넓이/.test(cat) || ((t.includes('반지름') || t.includes('지름')) && (t.includes('둘레') || t.includes('넓이') || t.includes('구하'))));
  if(isCircleCalc && !/(원기둥|원뿔|구\b)/.test(t)) return svgCircleFigure(firstNum(t), (/^지름|[^반]지름/.test(t)) ? '지름' : '반지름');
  if(t.includes('선분')) return svgShapeFigure('선분');
  if(t.includes('직선') || (t.includes('각') && !/(삼각형|사각형|다각형|정사각형|직사각형|오각형|육각형|칠각형|팔각형|십각형|평행사변형|마름모|사다리꼴)/.test(t))) return svgBasicLineAngle(ns[0] || 60);
  if(t.includes('각기둥')) return svgSolidFigure('각기둥');
  if(t.includes('각뿔')) return svgSolidFigure('각뿔');
  if(t.includes('직육면체') || t.includes('상자')) return svgSolidFigure('직육면체');
  if(t.includes('정육면체') || t.includes('쌓기나무')) return svgSolidFigure('정육면체');
  if(t.includes('합동')) return svgCongruentTriangles();
  if(t.includes('대칭')) return svgShapeFigure('선대칭 도형');
  if(unitKey === 'move4') return svgShapeFigure('도형 이동');
  return '';
}

function enhanceGeometryVisuals(list, unitKey){
  const autoVisualSafeUnits = new Set(['area5','circarea6','trig_m3']);
  return list.map(q => {
    if(q?.visual || String(q?.q || '').includes('<svg')) return q;
    if(!autoVisualSafeUnits.has(unitKey)) return q;
    const svg = visualForQuestion(q, unitKey);
    return svg ? prependVisual(q, svg) : q;
  });
}

  'plane3','circle3','angle4','tri4','quad4','poly4','move4',

/* ============================================================
   APP STATE
============================================================ */
let S={name:"",school:"",cls:"",num:"",grade:"",semester:"",chapter:"",quiz:[],idx:0,score:0,logs:[],startTs:0,endTs:0,qStartTs:0,elapsed:[],selAns:null,timerTick:null,heartbeatTick:null,idleTick:null,idleNudged:false,cancelSent:false};

/* ============================================================
   PAGE 1
============================================================ */
if(typeof window!=="undefined"){
  window.onload=function(){
    initGradeOptions();
    setupEventListeners();
  };
}

function initGradeOptions(){
  $('gradeG').innerHTML=Object.keys(CURR).map(g=>`<div class="gb" data-g="${g}">${g}</div>`).join('');
  document.querySelectorAll('#gradeG .gb').forEach(btn=>{
    btn.onclick=function(){
      document.querySelectorAll('#gradeG .gb').forEach(b=>b.classList.remove('on'));
      this.classList.add('on');
      showSemesterGroup();
    };
  });
}

function showSemesterGroup(){
  $('semG').classList.remove('hidden');
  $('chapG').classList.add('hidden');
  $('chapL').innerHTML="";
  document.querySelectorAll('.sem-g .sb').forEach(b=>b.classList.remove('on'));
  $('startBtn').disabled=true;
}

function setupEventListeners(){
  document.querySelectorAll('.sem-g .sb').forEach(btn=>{
    btn.onclick=function(){
      document.querySelectorAll('.sem-g .sb').forEach(b=>b.classList.remove('on'));
      this.classList.add('on');
      showChapterGroup();
    };
  });
  ['iNm','iSch'].forEach(id=>{
    $(id).oninput=checkStartCondition;
  });
}

function showChapterGroup(){
  const grade=document.querySelector('#gradeG .gb.on')?.getAttribute('data-g');
  const sem=document.querySelector('.sem-g .sb.on')?.getAttribute('data-s');
  if(!grade||!sem) return;
  const chaps=CURR[grade]?.[sem]||{};
  $('chapL').innerHTML=Object.entries(chaps).map(([name,key])=>`<div class="cb" data-c="${key}" data-cname="${name}">${name}</div>`).join('');
  $('chapG').classList.remove('hidden');
  document.querySelectorAll('#chapL .cb').forEach(btn=>{
    btn.onclick=function(){
      document.querySelectorAll('#chapL .cb').forEach(b=>b.classList.remove('on'));
      this.classList.add('on');
      checkStartCondition();
    };
  });
}

function checkStartCondition(){
  const nm=$('iNm').value.trim();
  const sch=$('iSch').value.trim();
  const grade=document.querySelector('#gradeG .gb.on');
  const sem=document.querySelector('.sem-g .sb.on');
  const chap=document.querySelector('#chapL .cb.on');
  $('startBtn').disabled=!(nm&&sch&&grade&&sem&&chap);
}

function validate(){ checkStartCondition(); }

/* ============================================================
   START
============================================================ */
function startQuiz(){
  S.name=$('iNm').value.trim(); S.school=$('iSch').value.trim();
  const key=CURR[S.grade]?.[S.semester]?.[S.chapter];
  S.quiz=enhanceGeometryVisuals(buildQuizFromGenerator(GEN[key]||g_fallback), key);
  S.idx=0; S.score=0; S.logs=[]; S.elapsed=[];
  S.startTs=Date.now(); S.endTs=0; S.selAns=null; S.idleNudged=false; S.cancelSent=false;
  // 퀴즈 시작 알림 (관리자 대시보드용)
  try{
    fetch(SHEETS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        type:'start',
        이름:S.name,학교:S.school,학년:S.grade,
        단원:`${S.semester} ${S.chapter}`,
        시작시간:new Date(S.startTs).toLocaleString('ko-KR')
      }),
      mode:'no-cors'
    }).catch(()=>{});
  }catch(e){}
  showPage('p2'); renderQ(); startTimer(); startIdleWatcher();
}

/* ============================================================
   TIMER
============================================================ */
function startTimer(){
  clearInterval(S.timerTick);
  S.timerTick=setInterval(()=>{
    const sec=Math.floor((Date.now()-S.startTs)/1000);
    const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');
    $('timer').textContent=`${m}:${s}`;
    $('timer').className='timer'+(sec>600?' warn':'');
  },500);
}

function currentQuestionInfo(){
  const q=S.quiz[S.idx]||{};
  return {
    currentIndex:S.idx+1,
    total:S.quiz.length||0,
    currentCat:q.cat||'',
    currentQuestion:cleanQ(q.q||q.f||'').slice(0,120),
    questionStartedAt:S.qStartTs ? new Date(S.qStartTs).toLocaleString('ko-KR') : '',
    questionIdleSec:S.qStartTs ? Math.floor((Date.now()-S.qStartTs)/1000) : 0
  };
}

function showIdleNudge(){
  const box=$('idleNudge');
  if(!box) return;
  const q=S.quiz[S.idx]||{};
  box.textContent=`잠깐 멈췄다면 괜찮아요. 지금 ${S.idx+1}번 문제의 조건을 한 줄씩 다시 읽어보고, 아는 것부터 표시해봐요.${q.cat?' ('+q.cat+')':''}`;
  box.classList.add('on');
  clearTimeout(box._hide);
  box._hide=setTimeout(()=>box.classList.remove('on'),12000);
}

function startIdleWatcher(){
  stopIdleWatcher();
  S.idleTick=setInterval(()=>{
    if(!S.qStartTs || S.endTs) return;
    const idleSec=Math.floor((Date.now()-S.qStartTs)/1000);
    if(idleSec>=180 && !S.idleNudged){
      S.idleNudged=true;
      showIdleNudge();
      sendOngoingSignal('heartbeat');
    }
  },1000);
}

function stopIdleWatcher(){
  if(S.idleTick){
    clearInterval(S.idleTick);
    S.idleTick=null;
  }
}

/* ============================================================
   RENDER QUESTION
============================================================ */
function renderQ(){
  const q=S.quiz[S.idx]; S.selAns=null; S.qStartTs=Date.now(); S.idleNudged=false;
  $('qNm').textContent=S.name;
  $('qInfo').textContent=` | ${S.grade} ${S.semester}`;
  const tot=S.quiz.length;
  $('progLbl').textContent=`문항 ${S.idx+1}/${tot}`;
  $('progSc').textContent=`점수: ${S.score}`;
  $('progF').style.width=`${(S.idx/tot)*100}%`;
  $('qBadge').textContent=`문항 ${S.idx+1}`;
  $('qCat').textContent=`📌 ${q.cat}`;
  const _hasQ = q.q && !q.q.includes('아래 식을') && q.q.trim() !== '';
  if (!_hasQ && q.f) {
    $('qText').innerHTML = '<div style="font-size:1.5em;font-weight:800;text-align:center;padding:16px 0">' + renderF(q.f) + '</div>';
  } else {
    $('qText').innerHTML = renderQText(q.q || '아래 식을 계산하세요.');
  }
  const fb=$('fBox');
  fb.classList.add('hidden');
  const ab=$('ansBox'); ab.innerHTML=""; $('subBtn').disabled=true;
  if(q.type==='OX'){
    ab.innerHTML=`<div class="ox-g"><div class="ox-btn" id="oxO" onclick="pickOX('O')">⭕</div><div class="ox-btn" id="oxX" onclick="pickOX('X')">❌</div></div>`;
  }else if(q.type==='MC'){
    ab.innerHTML=`<div class="mc-l">${q.choices.map((c,i)=>`<div class="mc-i" id="mc${i}" onclick="pickMC(${i},'${c.replace(/'/g,"\\'")}')"><div class="mc-n">${i+1}</div><div class="mc-t">${c}</div></div>`).join('')}</div>`;
  }else{
    ab.innerHTML=`<input class="sa-in" type="text" id="saIn" placeholder="정답을 입력하세요" autocomplete="off">`;
    const inp=$('saIn');
    inp.addEventListener('input',()=>{S.selAns=inp.value.trim();$('subBtn').disabled=!S.selAns;});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.selAns)submitAns();});
    setTimeout(()=>inp.focus(),80);
  }
  const card=$('qCard'); card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
  S.qStartTs=Date.now();
  if(S.startTs && !S.endTs){
    sendOngoingSignal('heartbeat');
    setTimeout(()=>sendOngoingSignal('heartbeat'),800);
  }
}
function pickOX(v){$('oxO').className='ox-btn'+(v==='O'?' s-o':'');$('oxX').className='ox-btn'+(v==='X'?' s-x':'');S.selAns=v;$('subBtn').disabled=false;}
function pickMC(i,v){document.querySelectorAll('.mc-i').forEach(c=>c.classList.remove('on'));$('mc'+i).classList.add('on');S.selAns=v;$('subBtn').disabled=false;}

/* ============================================================
   SUBMIT
============================================================ */
function submitAns(){
  const q=S.quiz[S.idx];
  const elapsed=((Date.now()-S.qStartTs)/1000).toFixed(1);
  S.elapsed.push(parseFloat(elapsed));
  // 수식 동치 체크 (flex 플래그사용 문제는 flexEqCheck 사용)
  const ua=normAns(S.selAns||""),ca=normAns(q.a);
  const ok = q.flex ? flexEqCheck(S.selAns||'', q.a) : ua===ca;
  if(ok)S.score++;
  // desc > cleanQ 순으로 시트용 텍스트 결정
  const cleanQText = q.desc || cleanQ(q.q);
  S.logs.push({idx:S.idx+1,cat:q.cat,formula:q.f,q:cleanQText,rawQ:q.q,ua,ca,ok,elapsed,type:q.type,desc:q.desc||''});
  showFB(ok); $('subBtn').disabled=true;
  setTimeout(()=>{hideFB();S.idx++;S.idx<S.quiz.length?renderQ():(S.endTs=Date.now(),clearInterval(S.timerTick),showResults());},750);
}
function showFB(ok){$('fbIcon').textContent=ok?'⭕':'❌';$('fbMask').classList.add('on');}
function hideFB(){$('fbMask').classList.remove('on');}

function getWeakDetails(){
  const wrong={};
  S.logs.forEach(l=>{
    if(l.ok) return;
    const cat=(l.cat||'기타').trim()||'기타';
    if(!wrong[cat]) wrong[cat]={count:0, nums:[]};
    wrong[cat].count++;
    wrong[cat].nums.push(l.idx);
  });
  return wrong;
}

function getWeakGuide(cat){
  const c=String(cat||'');
  if(/겉넓이|표면적/.test(c)) return '겉넓이는 보이는 면만이 아니라 모든 면의 넓이를 더하는 공식과 단위를 다시 확인';
  if(/부피|들이/.test(c)) return '한 층의 양과 층수를 곱해 전체 양을 구하는 과정, 단위 쓰기를 다시 확인';
  if(/전개도/.test(c)) return '접었을 때 마주 보는 면, 밑면과 옆면의 위치 관계를 다시 확인';
  if(/겨냥도/.test(c)) return '보이는 모서리와 보이지 않는 모서리, 평행한 모서리의 방향을 다시 확인';
  if(/각기둥|각뿔|입체|쌓기/.test(c)) return '밑면, 옆면, 꼭짓점, 모서리의 개수를 실제 모양과 연결해서 다시 확인';
  if(/원넓이|원의 넓이/.test(c)) return '반지름×반지름×3.14 공식을 둘레 공식과 구분해서 다시 확인';
  if(/원둘레|원의 둘레|원주/.test(c)) return '지름×3.14 또는 반지름×2×3.14를 상황에 맞게 쓰는지 다시 확인';
  if(/원주각|중심각|호|현/.test(c)) return '같은 호에서 원주각은 중심각의 절반이라는 관계를 다시 확인';
  if(/가감법/.test(c)) return '두 식을 더하거나 빼서 한 문자를 없애는 과정을 다시 확인';
  if(/대입법/.test(c)) return '한 식을 한 문자에 대해 정리한 뒤 다른 식에 넣는 과정을 다시 확인';
  if(/연립방정식|해확인|방정식값/.test(c)) return '두 식을 동시에 만족하는 x, y 값을 구하고 대입해 확인하는 과정을 다시 확인';
  if(/띠그래프|원그래프|그래프|비율그래프/.test(c)) return '전체를 100%로 보고 항목별 비율을 그래프와 연결하는 법을 다시 확인';
  if(/평균|중앙값|최빈값|대표값/.test(c)) return '자료를 정렬한 뒤 평균, 중앙값, 최빈값의 뜻을 구분해서 다시 확인';
  if(/비례식|비율|백분율/.test(c)) return '기준량, 비교하는 양, 비율의 관계를 식으로 세우는 법을 다시 확인';
  if(/최대공약수/.test(c)) return '공통으로 나누어지는 수 중 가장 큰 수를 찾는 과정을 다시 확인';
  if(/최소공배수/.test(c)) return '공통 배수 중 가장 작은 수를 찾는 과정과 실제 상황 적용을 다시 확인';
  if(/수의정렬|수직선|정수|유리수/.test(c)) return '수직선에서 오른쪽으로 갈수록 큰 수라는 기준과 음수의 크기 비교를 다시 확인';
  return '틀린 문항의 조건, 사용한 공식, 계산 과정을 차례대로 다시 확인';
}

function formatWeakSummary(wrong=getWeakDetails()){
  const keys=Object.keys(wrong);
  if(!keys.length) return '';
  keys.sort((a,b)=>wrong[b].count-wrong[a].count || a.localeCompare(b,'ko'));
  const typeLine='[취약유형] ' + keys.map(k=>`${k}(${wrong[k].count}오답: ${wrong[k].nums.join(',')}번)`).join(', ');
  const guideLine='[복습요약] ' + keys.slice(0,3).map(k=>`${k}: ${getWeakGuide(k)}`).join(' / ');
  return typeLine + '\n' + guideLine;
}

/* ============================================================
   RESULTS
============================================================ */
function showResults(){
  const tot=S.quiz.length,pct=Math.round(S.score/tot*100);
  const sec=Math.floor((S.endTs-S.startTs)/1000);
  const m=Math.floor(sec/60),s=sec%60;
  // summary bar
  $('rGrade').textContent=`${S.grade} ${S.semester}`;
  $('rChap').textContent=S.chapter.replace(/\d+단원\. /,"");
  $('rTime').textContent=`총 ${m}분 ${s}초`;
  $('rScore').textContent=`${S.score} / ${tot}`;
  // grade banner
  let lbl;
  if(pct>=90)lbl="🏆 최우수! 완벽한 실력이에요!";
  else if(pct>=70)lbl="👏 우수! 훌륭한 실력이에요!";
  else if(pct>=50)lbl="👍 보통! 조금 더 연습해봐요!";
  else lbl="📚 분발! 틀린 문항을 복습해봐요!";
  $('gradeBanner').textContent=lbl;
  const weakText=formatWeakSummary();
  $('weakSummary').textContent=weakText;
  $('weakSummary').style.display=weakText?'block':'none';
  // question log
  $('logList').innerHTML=S.logs.map(l=>{
    const q=S.quiz[l.idx-1]||{};
    const typeKo=q.type==='OX'?'OX퀴즈':q.type==='MC'?'객관식':'주관식';
    // rawQ가 있으면 SVG 실제 렌더링, 없으면 클린 텍스트
    const rawForResult = l.rawQ || q.q || '';
    const hasRawQ = /<svg\b/i.test(rawForResult);
    const qText=(l.q||'').trim();
    const fText=(l.formula||'').trim();
    const formulaHtml=fText?`<div class="log-formula">${renderF(fText)}</div>`:'';
    // SVG 있는 문제는 SVG 실제 렌더링
    const qHtml=hasRawQ
      ?`<div class="log-q log-svg-q">${renderQText(rawForResult)}</div>`
      :(qText&&qText!=='아래 식을 계산하세요.'&&qText!==fText
        ?`<div class="log-q">Q. ${escH(qText)}</div>`
        :(fText?'':`<div class="log-q">Q. (계산 문제)</div>`));
    return `
    <div class="log-card ${l.ok?'ok':'ng'}">
      <div class="log-card-head">
        <div class="ln">${l.idx}</div>
        <span class="log-type-badge">${typeKo}</span>
        <span class="log-cat">${l.cat||''}</span>
        <div class="log-chk">${l.ok?'✅':'❌'}</div>
      </div>
      ${qHtml}
      ${formulaHtml}
      <div class="log-ans-row">
        <div class="log-ans-box my">
          <div class="log-ans-lbl">내 답</div>
          <div class="log-ans-val">${escH(l.ua)||'(미입력)'}</div>
        </div>
        <div class="log-ans-box correct">
          <div class="log-ans-lbl">정답</div>
          <div class="log-ans-val">${escH(l.ca)}</div>
        </div>
      </div>
      <div class="log-elapsed">⏱ ${l.elapsed}초</div>
    </div>`;
  }).join('');
  showPage('p3');
  if(pct>=70)confetti();
  stopHeartbeat();
  // 퀴즈 완료 시 자동 전송
  autoSendToSheets();
}

/* ============================================================
   GOOGLE SHEETS — 자동 저장 (URL 고정)
============================================================ */
const SHEETS_URL='https://script.google.com/macros/s/AKfycbzmBhR3RBHLYJuy-RJSvf-k-GIlje9eixbGsL69A-RND6ZCp82zJZ-qOMoUqJNVeLhR/exec';

function buildSessionPayload(type){
  return {
    type,
    이름:S.name,
    학교:S.school,
    학년:S.grade,
    단원:`${S.semester} ${S.chapter}`,
    시작시간:S.startTs ? new Date(S.startTs).toLocaleString('ko-KR') : ''
  };
}

function buildLiveSessionPayload(type){
  const payload=buildSessionPayload(type);
  payload['확인시각']=new Date().toLocaleString('ko-KR');
  Object.assign(payload,currentQuestionInfo());
  return payload;
}

function sendOngoingSignal(type,opt={}){
  if(!S.startTs) return;
  const body=JSON.stringify(buildLiveSessionPayload(type));
  if(opt.beacon){
    try{
      if(navigator.sendBeacon){
        const blob=new Blob([body],{type:'application/json'});
        if(navigator.sendBeacon(SHEETS_URL,blob)) return;
      }
    }catch(e){}
  }
  try{
    fetch(SHEETS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body,
      mode:'no-cors',
      keepalive:type!=='start'
    }).catch(()=>{});
  }catch(e){}
}

function startHeartbeat(){
  stopHeartbeat();
  sendOngoingSignal('heartbeat');
  S.heartbeatTick=setInterval(()=>sendOngoingSignal('heartbeat'),15000);
}

function stopHeartbeat(){
  if(S.heartbeatTick){
    clearInterval(S.heartbeatTick);
    S.heartbeatTick=null;
  }
  stopIdleWatcher();
}

startQuiz=function(){
  const gradeEl=document.querySelector('#gradeG .gb.on');
  const semEl=document.querySelector('.sem-g .sb.on');
  const chapEl=document.querySelector('#chapL .cb.on');
  if(!gradeEl||!semEl||!chapEl){
    checkStartCondition();
    toast('학년, 학기, 단원을 모두 선택해주세요.','err');
    return;
  }
  S.name=$('iNm').value.trim();
  S.school=$('iSch').value.trim();
  S.grade=gradeEl.getAttribute('data-g');
  S.semester=semEl.getAttribute('data-s');
  S.chapter=chapEl.getAttribute('data-cname')||chapEl.textContent;
  const key=chapEl.getAttribute('data-c');
  try{
    const makeQuiz=GEN[key];
    if(typeof makeQuiz!=="function") throw new Error(`연결된 문제 생성기가 없습니다: ${key}`);
    S.quiz=enhanceGeometryVisuals(buildQuizFromGenerator(makeQuiz), key);
    if(!Array.isArray(S.quiz)||!S.quiz.length) throw new Error('문항이 생성되지 않았습니다.');
  }catch(e){
    console.error('quiz start failed', {grade:S.grade, semester:S.semester, chapter:S.chapter, key, error:e});
    toast('이 단원의 문제 연결을 찾지 못했습니다.','err');
    return;
  }
  S.idx=0; S.score=0; S.logs=[]; S.elapsed=[];
  S.startTs=Date.now(); S.endTs=0; S.selAns=null; S.cancelSent=false;
  showPage('p2'); renderQ(); startTimer(); startIdleWatcher();

  sendOngoingSignal('start');

  startHeartbeat();
};
if(typeof window!=="undefined") window.startQuiz=startQuiz;

function cancelOngoingSession(){
  if(!S.startTs || S.endTs || S.cancelSent) return;
  S.cancelSent=true;
  stopHeartbeat();
  const body=JSON.stringify(buildSessionPayload('cancel'));
  try{
    if(navigator.sendBeacon){
      const blob=new Blob([body],{type:'application/json'});
      if(navigator.sendBeacon(SHEETS_URL,blob)) return;
    }
  }catch(e){}
  try{
    fetch(SHEETS_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body,
      mode:'no-cors',
      keepalive:true
    }).catch(()=>{});
  }catch(e){}
}

if(typeof window!=="undefined"){
  window.addEventListener('pagehide',cancelOngoingSession);
  window.addEventListener('beforeunload',cancelOngoingSession);
}

async function autoSendToSheets(){
  setShStatus('⏳','저장 중...','#888');
  $('shRetryBtn').style.display='none';
  const totMs=S.endTs-S.startTs;
  const payload={
    제출일시:new Date().toLocaleString('ko-KR'),
    학교:S.school,학년:S.grade,이름:S.name,
    단원:`${S.semester} ${S.chapter}`,
    총점:S.score,총문항:S.quiz.length,백분율:Math.round(S.score/S.quiz.length*100),
    소요시간:`${Math.floor(totMs/60000)}분 ${Math.floor((totMs%60000)/1000)}초`,
    시작시간:new Date(S.startTs).toLocaleString('ko-KR'),
    종료시간:new Date(S.endTs).toLocaleString('ko-KR'),
    취약유형:formatWeakSummary(),
    문항목록:S.logs.map(l=>{
      const q=S.quiz[l.idx-1]||{};
      const typeKo=q.type==='OX'?'OX퀴즈':q.type==='MC'?'객관식':'주관식';
      // 시트에 저장할 질문텍스트: desc > cleanQ 순, 없으면 formula
      const sheetQ = l.desc || l.q || cleanQ(l.rawQ||'') || l.formula || '';
      return{idx:l.idx,유형:typeKo,분류:l.cat,내용:sheetQ.slice(0,100),내답:l.ua,정답:l.ca,정오:l.ok?"O":"X",시간:l.elapsed};
    })
  };
  try{
    await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),mode:'no-cors',keepalive:true});
    setShStatus('✅','구글 시트에 저장 완료!','#1E8449');
    toast('✅ 결과가 자동 저장됐어요!','ok');
    $('shRetryBtn').style.display='none';
  }catch(e){
    setShStatus('❌',`저장 실패 (${e.message})`,'#C0392B');
    toast("❌ 저장 실패 — '다시 전송' 버튼을 눌러주세요",'err');
    $('shRetryBtn').style.display='block';
  }
}

function setShStatus(icon,msg,color){
  $('shStatusIcon').textContent=icon;
  $('shStatusMsg').textContent=msg;
  $('shStatusMsg').style.color=color;
}

/* ============================================================
   RESTART
============================================================ */
function restart(){
  cancelOngoingSession();
  clearInterval(S.timerTick);
  S={name:"",school:"",grade:"",semester:"",chapter:"",quiz:[],idx:0,score:0,logs:[],startTs:0,endTs:0,qStartTs:0,elapsed:[],selAns:null,timerTick:null,heartbeatTick:null,idleTick:null,idleNudged:false,cancelSent:false};
  document.body.className="";
  document.querySelectorAll('.gb,.sb,.cb').forEach(b=>b.classList.remove('on'));
  ['iNm','iSch'].forEach(id=>$(id).value='');
  $('semG').classList.add('hidden'); $('chapG').classList.add('hidden');
  $('startBtn').disabled=true;
  // shUrl는 localStorage에서 유지 (지우지 않음)
  setShStatus('⏳','결과 전송 중...','#888');
  $('shRetryBtn').style.display='none';
  showPage('p1');
}

/* ============================================================
   UTILS
============================================================ */
function $(id){return document.getElementById(id);}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);}
let _tt;
function toast(msg,cls=''){const t=$('toast');t.textContent=msg;t.className=`toast on ${cls}`;clearTimeout(_tt);_tt=setTimeout(()=>t.className='toast',3200);}
function confetti(){
  const cols=['#FF6B9D','#FFD93D','#4ECDC4','#6C5CE7','#A8E6CF','#FF8B94'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div'); el.className='conf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-16px;background:${rc(cols)};width:${ri(6,14)}px;height:${ri(6,14)}px;animation-duration:${(Math.random()*2+1.5).toFixed(2)}s;animation-delay:${(Math.random()*.8).toFixed(2)}s;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el); el.addEventListener('animationend',()=>el.remove());
  }
}
</script>
